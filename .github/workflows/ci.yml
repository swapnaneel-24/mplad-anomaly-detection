# PEIARS continuous integration (PR-06B).
#
# Runs the existing scientific-integrity, backend, frontend, integration,
# E2E and container checks on every pull request to main and every push to
# main, plus manual workflow_dispatch. No deployment, no image publication.
#
# Action references are pinned to verified full commit SHAs resolved via
# `git ls-remote` (PR-06B §7.4). The pinned SHAs are:
#   actions/checkout    v5.1.0  fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   actions/setup-python v5.6.0 a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/setup-node   v5.0.0 a0853c24544627f65ddf259abe73b1d18a591444
#   actions/cache        v5.1.0 caa296126883cff596d87d8935842f9db880ef25
#   actions/upload-artifact v4.6.2 ea165f8d65b6e75b540449e92b4886f43607fa02
#
# Permissions: contents: read only. No pull_request_target. No production
# secrets. No write tokens. PR metadata is never interpolated into a
# privileged shell. Uploaded artifacts are restricted to sanitized test
# output (Playwright traces, JUnit XML) — never .env, cookies or DB dumps.

name: PEIARS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded in-flight runs for the same ref (frees CI minutes; a
# cache miss never changes correctness — every job re-runs from the lockfile).
concurrency:
  group: peiars-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: read-only access to the repository contents. No
# packages:, no id-token:, no deployments:. Mandatory checks that fail MUST
# fail the workflow (no continue-on-error on mandatory jobs).
permissions:
  contents: read

jobs:
  # =========================================================================
  # Backend: Python 3.12 + real PostgreSQL (pgserver) + frozen isolation.
  # =========================================================================
  backend-tests:
    name: Backend tests (Python 3.12, real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install backend dependencies (lockfile incl. pgserver)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run pytest (real PostgreSQL via pgserver; incl. frozen isolation)
        env:
          # Tests construct explicit Settings(_env_file=None); no real .env.
          # pgserver starts a disposable PostgreSQL 16 per session.
          PYTHONPATH: .
        run: |
          pytest -ra --junitxml=../test-results/backend-junit.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-junit
          path: test-results/backend-junit.xml
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # Frozen research integrity (SHA-256 manifest check).
  # =========================================================================
  frozen-integrity:
    name: Frozen research integrity (SHA-256)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify frozen research file hashes against manifest
        run: python ci/check_frozen_integrity.py

  # =========================================================================
  # Frontend: Node 22 LTS — typecheck, lint, unit tests, build, OpenAPI drift.
  # =========================================================================
  frontend:
    name: Frontend (Node 22 — typecheck, lint, vitest, build, OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci — reproducible from lockfile)
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit/integration tests (Vitest)
        run: npm test -- --reporter=verbose --reporter=junit --outputFile=../test-results/frontend-junit.xml

      - name: Production build
        run: npm run build

      - name: OpenAPI alignment (drift check vs backend/contracts/openapi.json)
        run: npm run openapi:check

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-junit
          path: test-results/frontend-junit.xml
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # Browser E2E: Chromium + real FastAPI + real PostgreSQL (pgserver) + Vite.
  # =========================================================================
  e2e:
    name: Browser E2E (Chromium + real backend + pgserver)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Set up Node 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies (lockfile incl. pgserver)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium with OS deps
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (disposable pgserver + migrations + backend + Vite)
        env:
          PEIARS_E2E_REPO: ${{ github.workspace }}
        run: |
          # pkill any stale servers from a previous attempt (defensive).
          pkill -f "vite|serve.py|pgserver" 2>/dev/null || true
          bash frontend/scripts/run-e2e.sh

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: |
            frontend/screenshots
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  # Container: Compose validation + image build + migration + smoke tests.
  # Requires Docker (available on ubuntu-latest hosted runners).
  # =========================================================================
  container:
    name: Container build + Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: peiars-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PEIARS_FRONTEND_PORT: "8080"
      PEIARS_COMPOSE_PROJECT: peiars-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Generate CI-ephemeral .env.compose (unique secret + password)
        run: |
          # Ephemeral, run-scoped credentials. Never reused, never committed,
          # never printed. The Settings validator requires a real secret.
          SECRET="$(openssl rand -hex 32)"
          PG_PASS="$(openssl rand -hex 16)"
          cat > .env.compose <<EOF
          POSTGRES_USER=peiars_ci
          POSTGRES_PASSWORD=${PG_PASS}
          POSTGRES_DB=peiars_review_ci
          PEIARS_ENVIRONMENT=development
          PEIARS_SESSION_COOKIE_SECURE=false
          PEIARS_DEMONSTRATION_SOURCES=true
          PEIARS_SESSION_SECRET=${SECRET}
          PEIARS_CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
          PEIARS_FRONTEND_PORT=8080
          EOF
          echo "Generated .env.compose (secret length: ${#SECRET}; not printed)"

      - name: Validate Compose configuration
        run: docker compose --env-file .env.compose config >/dev/null

      - name: Build backend and frontend images
        run: docker compose --env-file .env.compose build backend frontend

      - name: Start PostgreSQL and wait for health
        run: docker compose --env-file .env.compose up -d db

      - name: Apply migrations explicitly (one-shot migrate service)
        run: docker compose --env-file .env.compose run --rm migrate

      - name: Start backend and frontend
        run: docker compose --env-file .env.compose up -d backend frontend

      - name: Wait for backend readiness (migrated schema)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8080/api/v1/health/ready || echo 000)
            if [ "$code" = "200" ]; then echo "backend ready"; cat /tmp/ready.json; exit 0; fi
            sleep 3
          done
          echo "backend did not become ready (last status: $code)"
          cat /tmp/ready.json 2>/dev/null || true
          docker compose --env-file .env.compose logs backend
          exit 1

      - name: Run container smoke tests
        env:
          # The smoke test provisions an admin via `docker compose exec`,
          # which needs the SAME env file + project name as the stack. The
          # project name is the unique CI-scoped name set at the job level.
          PEIARS_ENV_FILE: .env.compose
          PEIARS_COMPOSE_PROJECT: peiars-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash ci/container_smoke_test.sh 8080

      # CI-only cleanup: the project name is unique to this run, so `down -v`
      # removes ONLY this run's volume. The developer's normal stack never
      # uses this project name (see docs/dev/CONTAINER_TROUBLESHOOTING.md).
      - name: Tear down CI-owned resources
        if: always()
        run: |
          docker compose --env-file .env.compose down -v || true
          rm -f .env.compose
