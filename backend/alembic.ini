# Alembic configuration for the PEIARS backend (PR-03).
#
# The database URL is supplied at migration time via the
# PEIARS_DATABASE_URL environment variable (or the sqlalchemy.url key
# below, which reads it). Real credentials are never committed: they
# live in the uncommitted .env file or the deployment environment.
#
# Run migrations from the backend/ directory:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current
#   alembic history

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The URL is resolved from the environment in migrations/env.py so that
# credentials never appear in this committed file. The placeholder here
# is overridden at runtime.
sqlalchemy.url = postgresql+psycopg://localhost/peiars_review

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
