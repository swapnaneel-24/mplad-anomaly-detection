# PEIARS frontend nginx configuration (PR-06B).
#
# Serves the built Vite static bundle with SPA fallback and reverse-proxies
# /api/ to the backend Compose service. This is the single browser-visible
# origin in the local Compose stack: the browser talks to nginx only, and
# nginx forwards API requests to http://backend:8000 on the private Compose
# network.
#
# Header-preservation contract (PR-06B baseline constraint #3):
#   * Host            — forwarded as $http_host (the EXACT browser Host header,
#                       INCLUDING the port). Using $host would strip the port
#                       (e.g. localhost:8080 -> localhost), which makes the
#                       backend's request.base_url wrong (http://localhost
#                       instead of http://localhost:8080) and weakens the
#                       CSRF Origin defence-in-depth check that compares
#                       Origin against base_url. Verified empirically: see
#                       PR06B_CORRECTION_REPORT.md §4.
#   * X-Forwarded-For — appended with the real client IP.
#   * X-Forwarded-Proto — the original scheme (http for the local stack).
#   * Cookie / Set-Cookie — forwarded UNCHANGED. nginx forwards both by
#                       default; NO proxy_cookie_path / proxy_cookie_domain
#                       directives are used, so path, domain and SameSite
#                       attributes are preserved exactly as the backend sets
#                       them. This keeps the signed double-submit CSRF flow
#                       and the HttpOnly session cookie identical to direct
#                       origin access.
#   * No path rewriting — `proxy_pass http://backend:8000;` has NO URI part
#                       (no trailing slash, no path), so nginx forwards the
#                       original request URI unchanged:
#                       /api/v1/health/live -> backend:8000/api/v1/health/live.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security: emit a basic HSTS-free header set appropriate for an HTTP
    # local-development context. Do NOT add Strict-Transport-Security here
    # (the stack is HTTP-only; HSTS belongs to a TLS-terminating proxy in a
    # separately approved deployment).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    # --- API reverse proxy -------------------------------------------------
    # Matches /api/v1/* (and any /api/* path). More specific than `location /`,
    # so API traffic is proxied and everything else falls through to the SPA.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Header-preservation contract (see file header). $http_host is the
        # EXACT browser Host header (host:port) so the backend's
        # request.base_url and CSRF Origin defence-in-depth check see the
        # real browser-visible origin including the port. ($host strips the
        # port and would make base_url wrong — verified empirically.)
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookie (request) and Set-Cookie (response) are forwarded by nginx
        # by default. Do NOT add proxy_cookie_path / proxy_cookie_domain /
        # proxy_cookie_flags — they would rewrite cookie path/domain/attributes
        # and break the signed double-submit CSRF flow and SameSite semantics.

        # Allow long-running writes (case creation, transitions) and the
        # initial migration-affected readiness window.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering off for streaming-friendly endpoints (none today, but
        # keeps the contract simple if a future read-only SSE endpoint is
        # added in a separately approved milestone).
        proxy_buffering off;
    }

    # --- Static asset caching ---------------------------------------------
    # Vite emits content-hashed filenames under /assets/*. Cache them
    # immutably; index.html is NEVER cached so SPA updates are picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    # Client-side routing: every non-file, non-API path returns index.html so
    # React Router owns the URL. `try_files` checks the file, then the
    # directory, then falls back to the SPA entrypoint.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
